name: Feature or research proposal
description: Suggest a feature, dataset, baseline or experiment
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve, and which roadmap milestone does it relate to?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should be added or changed? Link papers or code where relevant.
    validations:
      required: true
  - type: input
    id: licenses
    attributes:
      label: Licenses involved
      description: License of any code, model or dataset this would add.
