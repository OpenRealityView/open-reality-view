[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-reality-view"
version = "0.0.1"
description = "Feed-forward generative 3D driving visualization from surround cameras"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Open Reality View contributors" }]
keywords = ["autonomous driving", "gaussian splatting", "novel view synthesis", "generative models"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.1", "numpy", "pyyaml"]

[project.optional-dependencies]
render = ["gsplat>=1.4"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit"]

[project.scripts]
orv = "orv.cli:main"

[project.urls]
Homepage = "https://openrealityview.github.io/open-reality-view/"
Repository = "https://github.com/OpenRealityView/open-reality-view"
Issues = "https://github.com/OpenRealityView/open-reality-view/issues"

[tool.setuptools.packages.find]
include = ["orv*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
