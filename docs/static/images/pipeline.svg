<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Open Reality View pipeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1200" height="340" rx="16" fill="#ffffff"/>

  <!-- legend -->
  <g font-size="13" fill="#334155">
    <rect x="25" y="20" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="47" y="32">Inputs and outputs</text>
    <rect x="190" y="20" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="212" y="32">3D-anchored: geometry and object existence</text>
    <rect x="520" y="20" width="14" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="542" y="32">Generative: appearance and unobserved regions</text>
    <rect x="870" y="20" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
    <text x="892" y="32">Planning and interaction</text>
  </g>

  <!-- main row -->
  <g stroke-width="1.5">
    <rect x="25" y="64" width="170" height="100" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="221" y="64" width="170" height="100" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="417" y="64" width="170" height="100" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="613" y="64" width="170" height="100" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="809" y="64" width="170" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="1005" y="64" width="170" height="100" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">
    <text x="110" y="96">Surround</text><text x="110" y="115">cameras</text>
    <text x="306" y="96">Image</text><text x="306" y="115">encoder</text>
    <text x="502" y="96">Feed-forward</text><text x="502" y="115">4D Gaussians</text>
    <text x="698" y="96">Virtual-camera</text><text x="698" y="115">projection</text>
    <text x="894" y="96">One-step</text><text x="894" y="115">generative decoder</text>
    <text x="1090" y="96">Reality</text><text x="1090" y="115">view</text>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#475569">
    <text x="110" y="138">N views × T frames</text><text x="110" y="154">intrinsics · ego poses</text>
    <text x="306" y="138">DINOv2 features</text><text x="306" y="154">cross-view fusion</text>
    <text x="502" y="138">depth · velocity</text><text x="502" y="154">color · latent</text>
    <text x="698" y="138">gsplat at ¼ resolution</text><text x="698" y="154">features · depth · alpha</text>
    <text x="894" y="138">temporal recurrence</text><text x="894" y="154">fills unseen regions</text>
    <text x="1090" y="138">any viewpoint</text><text x="1090" y="154">≥ 20 FPS target</text>
  </g>

  <!-- data flow -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="197" y1="114" x2="218" y2="114"/>
    <line x1="393" y1="114" x2="414" y2="114"/>
    <line x1="589" y1="114" x2="610" y2="114"/>
    <line x1="785" y1="114" x2="806" y2="114"/>
    <line x1="981" y1="114" x2="1002" y2="114"/>
    <line x1="698" y1="248" x2="698" y2="168"/>
    <path d="M1040 166 V206 H894 V168"/>
  </g>
  <text x="967" y="224" text-anchor="middle" font-size="12" fill="#475569">previous frame, warped by ego motion</text>
  <line x1="1130" y1="248" x2="1130" y2="168" stroke="#16a34a" stroke-width="2" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>

  <!-- bottom row -->
  <rect x="25" y="250" width="562" height="66" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="45" y="273" font-size="13.5" font-weight="600" fill="#0f172a">Training data and supervision</text>
  <text x="45" y="292" font-size="12.5" fill="#475569">nuScenes · nuPlan · Waymo · Argoverse 2 · DDAD · KITTI</text>
  <text x="45" y="308" font-size="12.5" fill="#475569">real-camera photometric loss · OmniRe pseudo ground truth · video-diffusion distillation</text>

  <rect x="613" y="250" width="170" height="66" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="698" y="277" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Virtual camera pose</text>
  <text x="698" y="297" text-anchor="middle" font-size="12.5" fill="#475569">height · pitch · yaw · FOV</text>

  <rect x="809" y="250" width="366" height="66" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="829" y="273" font-size="13.5" font-weight="600" fill="#0f172a">Planner intent and tap-to-go</text>
  <text x="829" y="292" font-size="12.5" fill="#475569">path · turn chevrons · parking pin, depth-tested</text>
  <text x="829" y="308" font-size="12.5" fill="#475569">tap (u, v) → rendered depth → 3D goal</text>
</svg>
